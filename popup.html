<!DOCTYPE html>
<html>
<head>
    <title>Teams Theme</title>
    <link id="theme-css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', 'Lato', Arial, sans-serif;
            background: rgb(var(--theme-color-70, 0, 0, 0));
            color: #fff;
            padding: 0;
            margin: 0;
            width: 340px;
            overflow-x: hidden;
            max-height: 580px;
            overflow-y: auto;
        }
        a { color: #fff; font-weight: normal; }
        .settings-card {
            background: rgb(var(--theme-color-80, 51, 51, 51));
            padding: 20px 18px 16px 18px;
        }
        .popup-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1em;
        }
        .popup-icon {
            width: 28px;
            height: 28px;
            margin-right: 4px;
        }
        h3 {
            margin: 0;
            font-size: 1.2em;
            font-weight: 600;
        }
        .presets {
            display: flex;
            gap: 8px;
        }
        button {
            flex: 1;
            padding: 6px 8px;
            white-space: nowrap;
            min-width: 0;
            font-size: 0.9em;
            border-radius: 6px;
            border: 1px solid rgb(var(--theme-color-40, 34, 197, 94));
            background: transparent;
            color: #fff;
            cursor: pointer;
        }
        button:hover {
            border-color: rgb(var(--theme-color-30, 74, 222, 128));
        }
        [hidden] {
            display: none !important;
        }
        button.active {
            background: rgb(var(--theme-color-40, 34, 197, 94));
            color: rgb(var(--theme-color-100, 5, 46, 22));
        }
        button:disabled {
            opacity: 0.4;
            cursor: default;
        }
        #undo {
            margin-top: 8px;
            width: 100%;
        }
        .section-title {
            margin: 16px 0 6px;
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.7;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 4px 0;
            font-weight: 500;
        }
        .switch {
            appearance: none;
            flex: none;
            position: relative;
            width: 34px;
            height: 18px;
            margin: 0;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            transition: background 0.2s;
        }
        .switch::before {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.2s;
        }
        .switch:checked {
            background: rgb(var(--theme-color-30, 74, 222, 128));
        }
        .switch:checked::before {
            transform: translateX(16px);
        }
        select {
            width: 130px;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid rgb(var(--theme-color-40, 34, 197, 94));
            background: rgb(var(--theme-color-0, 240, 253, 244));
            color: rgb(var(--theme-color-80, 20, 83, 45));
            transition: border-color 0.2s;
        }
        select:focus, select:hover {
            border-color: rgb(var(--theme-color-30, 74, 222, 128));
        }
        #status {
            min-height: 1.2em;
            margin-top: 10px;
            color: rgb(var(--theme-color-30, 21, 128, 61));
            font-size: 0.95em;
        }
    </style>
</head>
<body>
    <div class="settings-card">
        <div class="popup-title">
            <img src="icon.png" alt="Teams Icon" class="popup-icon">
            <h3><a target="_blank" href="https://github.com/ItsChrisHickman/themes-for-teams">Themes for Teams</a></h3>
        </div>
        <div class="presets">
            <button type="button" data-preset="recommended">Recommended</button>
            <button type="button" data-preset="streamlined">Streamlined</button>
            <button type="button" data-preset="teamsDefault">Teams default</button>
        </div>
        <button type="button" id="undo" disabled>&#8630; Undo</button>
        <div id="status"></div>
        <div id="settings"></div>
    </div>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
</body>
</html>
